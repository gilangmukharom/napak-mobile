name: Build Android

# APK untuk dicoba langsung di HP Android. Tidak ditandatangani dengan kunci
# rilis — cukup debug signing bawaan Flutter, yang memang untuk dicoba sendiri
# dan bukan untuk diedarkan.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: >-
          Alamat backend, lengkap dengan /api. Tempel URL dari `npm run tunnel`.
        required: true
        default: https://contoh.trycloudflare.com/api
      map_style_url:
        description: >-
          Gaya peta. Kosongkan untuk memakai gaya pastel Napak dari backend.
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Bangun kode drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisis dan uji
        run: |
          flutter analyze lib test
          flutter test

      - name: Bangun APK
        env:
          API_URL: ${{ inputs.api_url }}
          MAP_STYLE: ${{ inputs.map_style_url }}
        run: |
          argumen=(--release --dart-define=NAPAK_API_URL="$API_URL")
          if [ -n "$MAP_STYLE" ]; then
            argumen+=(--dart-define=NAPAK_MAP_STYLE="$MAP_STYLE")
          fi
          flutter build apk "${argumen[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: Napak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Ringkasan
        run: |
          {
            echo "## Napak — APK siap diunduh"
            echo ""
            echo "Backend: \`${{ inputs.api_url }}\`"
            echo ""
            echo "Unduh artefak \`Napak-apk\`, pindahkan ke HP, lalu pasang."
            echo "Android akan meminta izin memasang dari sumber tak dikenal."
            echo ""
            echo "> Pastikan backend dan tunnel-nya masih hidup — alamat di atas"
            echo "> sudah tertanam di dalam APK ini."
          } >> "$GITHUB_STEP_SUMMARY"
